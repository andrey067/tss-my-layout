name: deploy

on:
  workflow_run:
    workflows: ["release"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    container:
      image: node:22
    steps:
      - name: Checkout (main, inclui chore(release) e VERSION)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ssh/rsync
        run: |
          apt-get update -qq
          apt-get install -y -qq openssh-client rsync

      - name: Setup deploy key
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

      - name: Resolve released version
        id: version
        run: |
          TAG=$(git ls-remote --tags origin 'v*' 2>/dev/null | awk '{print $2}' | sed 's#refs/tags/##' | sort -V | tail -1)
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Sync project to host
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'current_frame.png' \
            --exclude '__pycache__' \
            --exclude '.venv' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:/home/${DEPLOY_USER}/tss/"
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

      - name: Restart service
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "echo '${{ steps.version.outputs.version }}' > /home/${DEPLOY_USER}/tss/.deployed-version && \
             sudo systemctl restart tss-my-layouts.service && \
             systemctl is-active tss-my-layouts.service"
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
